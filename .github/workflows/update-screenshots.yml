name: Update README Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      THREE_PL_BASE_URL: ${{ secrets.THREE_PL_BASE_URL }}
      THREE_PL_ONE_COMPANY_USER: ${{ secrets.THREE_PL_ONE_COMPANY_USER }}
      THREE_PL_ONE_COMPANY_PASSWORD: ${{ secrets.THREE_PL_ONE_COMPANY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture page screenshots
        run: npm run screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Update page screenshots"
            git push
          fi
